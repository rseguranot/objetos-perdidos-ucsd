<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de puente UCSD</title>
<style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:20px;color:#174e3e}input,button{font:inherit;padding:12px}input{width:95%}iframe{width:100%;height:220px;border:1px solid #ddd;margin-top:20px}pre{white-space:pre-wrap}</style>
<h1>Prueba de conexión Apps Script</h1>
<p>Solo verifica comunicación. No envía sesiones, fotografías ni datos de objetos.</p>
<form id="probe"><label>URL de implementación <input id="endpoint" type="url" required placeholder="https://script.google.com/macros/s/…/exec"></label><button>Comprobar conexión</button></form>
<pre id="result" role="status">Pendiente de implementación en QA.</pre>
<div id="frame"></div>
<script>
let frame,nonce,peer,peerOrigin,deadline;
const result=document.getElementById('result');
document.getElementById('probe').addEventListener('submit',event=>{
 event.preventDefault();
 const url=new URL(document.getElementById('endpoint').value);
 if(url.origin!=='https://script.google.com'||!/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url.pathname)){result.textContent='Utiliza la URL /exec del despliegue de prueba.';return;}
 clearTimeout(deadline);peer=null;peerOrigin=null;nonce=crypto.randomUUID();
 url.searchParams.set('origin',location.origin);url.searchParams.set('nonce',nonce);
 frame=document.createElement('iframe');frame.title='Puente de prueba Apps Script';frame.src=url.href;
 frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms');
 document.getElementById('frame').replaceChildren(frame);
 result.textContent='Esperando conexión…';
 deadline=setTimeout(()=>{result.textContent='Sin respuesta. El puente no está validado; no continuar con fotografías.';},30000);
});
window.addEventListener('message',event=>{
 if(!frame||!event.source||!event.data||event.data.nonce!==nonce)return;
 const origin=new URL(event.origin);
 if(origin.protocol!=='https:'||!(origin.hostname==='script.google.com'||/^n-[a-z0-9-]+-script[.]googleusercontent[.]com$/.test(origin.hostname)))return;
 // HTMLService has an inner sandbox. Bind the sender to this exact frame tree.
 let belongs=false;
 try{belongs=event.source===frame.contentWindow||event.source.parent===frame.contentWindow||event.source.parent.parent===frame.contentWindow;}catch{return;}
 if(!belongs)return;
 if(event.data.kind==='ready'&&!peer){peer=event.source;peerOrigin=event.origin;peer.postMessage({kind:'ping',nonce},peerOrigin);return;}
 if(event.source!==peer||event.origin!==peerOrigin)return;
 if(event.data.kind==='pong'&&event.data.result?.ok===true&&event.data.result?.service==='ucsd-bridge-probe'){clearTimeout(deadline);result.textContent='Conexión verificada: iframe → google.script.run → respuesta. Falta verificar autenticación y fotos antes de activar el servicio.';}
 if(event.data.kind==='failed'){clearTimeout(deadline);result.textContent='Apps Script rechazó la ejecución. No continuar con fotografías.';}
});
</script>
</html>
